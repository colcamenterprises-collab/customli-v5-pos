name: POS release gate
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  statuses: write
jobs:
  visual-and-regression:
    name: POS release gate
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run release:gate
      - run: python3 scripts/publish-release-check.py
        env:
          GH_TOKEN: ${{ github.token }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pos-release-evidence
          path: qa/release-results/
          retention-days: 14
      - name: Trigger combined Android test APK build
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.CUSTOMLI_V5_DISPATCH_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::warning::Set CUSTOMLI_V5_DISPATCH_TOKEN with contents:write on customli-v5 to enable automatic POS-to-Android build handoff."
            exit 0
          fi
          jq -n --arg sha "$GITHUB_SHA" '{event_type:"customli-v5-pos-updated",client_payload:{sha:$sha}}' |
            gh api --method POST repos/colcamenterprises-collab/customli-v5/dispatches --input -
